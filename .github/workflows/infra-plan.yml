name: infra-plan

# One Terraform plan for the stage named in the input, for review on 
# a pull request. infra.yml calls this once per stage.
on:
  workflow_call:
    inputs:
      environment:
        description: Stage to plan. Names the resources and the state file.
        required: true
        type: string
      herald_mode:
        description: Value for var.herald_mode. The plan decides it, because apply applies this plan.
        required: false
        default: Dry
        type: string

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest

    # A plan is not a deployment, so this job declares no environment. It signs in as the read-only
    # plan identity, which keeps the stage identities out of reach of a pull request: a pull request
    # runs the workflow file from its own branch.
    permissions:
      contents: read
      id-token: write
      pull-requests: write

    env:
      TF_VERSION: 1.16.2
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_AZUREAD: true

    steps:
      - uses: actions/checkout@v7

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_PLAN_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # When the state file does not exist yet, terraform init creates it, and creating it takes a lease
      # the read-only plan identity may not take. That is the case for every stage before its first
      # apply. The plan then runs against an empty local state, which is what the backend would hold.
      - name: Terraform init
        working-directory: deploy
        env:
          STATE_KEY: herald-${{ inputs.environment }}.tfstate
        run: |
          account="$(sed -n 's/^ *storage_account_name *= *"\(.*\)"/\1/p' providers.tf)"
          container="$(sed -n 's/^ *container_name *= *"\(.*\)"/\1/p' providers.tf)"
          exists="$(az storage blob exists --auth-mode login \
            --account-name "$account" --container-name "$container" --name "$STATE_KEY" \
            --query exists -o tsv)"

          if [ "$exists" = "true" ]; then
            terraform init -input=false -backend-config="key=$STATE_KEY"
          else
            echo "No state at $STATE_KEY yet, planning against an empty state."
            printf 'terraform {\n  backend "local" {}\n}\n' > backend_override.tf
            terraform init -input=false
          fi

      # -lock=false because the plan identity may read the state but not lease it. A plan that runs
      # during an apply can read a state in between, which affects this comment and nothing else.
      # -refresh=false because refreshing the function app reads its app settings through
      # Microsoft.Web/sites/config/list/action, which Reader does not include. The plan compares the
      # configuration with the state and shows no drift. The apply on main refreshes as the stage
      # identity.
      - name: Terraform plan
        working-directory: deploy
        run: >
          terraform plan -input=false -lock=false -refresh=false -out=tfplan
          -var="environment=${{ inputs.environment }}"
          -var="revision=${{ github.sha }}"
          -var="herald_mode=${{ inputs.herald_mode }}"

      - name: Comment plan on the pull request
        if: github.event_name == 'pull_request'
        working-directory: deploy
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE: ${{ inputs.environment }}
          PR_NUMBER: ${{ github.event.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # One comment per stage, updated on every run. The marker tells the two stages apart.
          marker="<!-- terraform-plan:${STAGE} -->"

          {
            echo "$marker"
            echo "**Terraform plan (\`$STAGE\`)** [Run]($RUN_URL)"
            echo
            echo '```terraform'
            terraform show -no-color tfplan
            echo '```'
          } > comment.md

          id="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"${marker}\"))) | .id" \
            | tail -n 1)"

          if [ -n "$id" ]; then
            jq -Rs '{body: .}' comment.md \
              | gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" --input - > /dev/null
          else
            gh pr comment "$PR_NUMBER" --body-file comment.md
          fi
